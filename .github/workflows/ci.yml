name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxt-dev \
            libxinerama-dev libx11-xcb-dev \
            libxrandr-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run format check
        run: npm run format:check

  build:
    name: Build - ${{ matrix.os }}
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxt-dev \
            libxinerama-dev libx11-xcb-dev \
            libxrandr-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install dependencies
        run: npm ci

      - name: Build application (no packaging)
        run: npm run build
        env:
          # Skip code signing and notarization
          CSC_IDENTITY_AUTO_DISCOVERY: false
