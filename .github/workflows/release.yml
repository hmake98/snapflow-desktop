name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. Validate ───────────────────────────────────────────────────────────────
  # Run lint, format, and type checks before touching anything.
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxt-dev \
            libxinerama-dev libx11-xcb-dev \
            libxrandr-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

  # ── 2. Bump version ───────────────────────────────────────────────────────────
  # Bump the minor version locally only — nothing is pushed yet.
  # Uploads the updated package.json so all build jobs use the same version.
  prepare:
    name: Bump Version
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Bump minor version
        id: bump
        run: |
          NEW_VERSION=$(npm version minor --no-git-tag-version | sed 's/^v//')
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped to ${NEW_VERSION}"

      - name: Upload bumped package.json
        uses: actions/upload-artifact@v4
        with:
          name: bumped-package-json
          path: package.json

  # ── 3. Build ──────────────────────────────────────────────────────────────────
  # Build on all platforms using the bumped package.json.
  # Nothing is pushed to the repo until all builds succeed.
  build:
    name: Build — ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Download bumped package.json
        uses: actions/download-artifact@v4
        with:
          name: bumped-package-json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxt-dev \
            libxinerama-dev libx11-xcb-dev \
            libxrandr-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install dependencies
        run: npm ci

      - name: Create app bootstrap file
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            fs.mkdirSync('resources', { recursive: true });
            fs.writeFileSync('resources/app-bootstrap.json', JSON.stringify({
              SUPABASE_URL: process.env.SUPABASE_URL,
              SUPABASE_ANON_KEY: process.env.SUPABASE_ANON_KEY,
              SUPABASE_SERVICE_ROLE_KEY: process.env.SUPABASE_SERVICE_ROLE_KEY,
              GITHUB_CLIENT_ID: process.env.GITHUB_CLIENT_ID,
              GITHUB_CLIENT_SECRET: process.env.GITHUB_CLIENT_SECRET,
              ZOHO_CLIENT_ID: process.env.ZOHO_CLIENT_ID,
              ZOHO_CLIENT_SECRET: process.env.ZOHO_CLIENT_SECRET,
              NODE_ENV: 'production'
            }));
          "
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}

      - name: Build app
        run: npm run build:pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.yml
          if-no-files-found: ignore

  # ── 4. Release ────────────────────────────────────────────────────────────────
  # All builds passed — now commit the version bump, push the tag,
  # and publish the GitHub release.
  release:
    name: Release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Download bumped package.json
        uses: actions/download-artifact@v4
        with:
          name: bumped-package-json

      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release ${{ needs.prepare.outputs.tag }}"
          git tag ${{ needs.prepare.outputs.tag }}
          git push origin HEAD:${{ github.ref_name }}
          git push origin ${{ needs.prepare.outputs.tag }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: "*-build"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Release ${{ needs.prepare.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
