name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  prepare:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    # Only run version bump for manual triggers; tag pushes skip straight to build
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need a token that can push commits back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version in package.json
        id: bump
        run: |
          BUMP="${{ github.event.inputs.bump_type }}"
          NEW_VERSION=$(npm version $BUMP --no-git-tag-version | sed 's/^v//')
          TAG="v${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Bumped to ${NEW_VERSION} (tag: ${TAG})"

      - name: Commit and push version bump
        run: |
          git add package.json
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin HEAD:${{ github.ref_name }}
          git push origin ${{ steps.bump.outputs.tag }}

  build:
    name: Build Electron App
    # For tag pushes: run directly. For workflow_dispatch: wait for prepare job.
    needs: [prepare]
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/') || needs.prepare.result == 'success')
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ needs.prepare.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create app bootstrap file
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const resourcesDir = 'resources';
            fs.mkdirSync(resourcesDir, { recursive: true });
            const data = {
              SUPABASE_URL: process.env.SUPABASE_URL,
              SUPABASE_ANON_KEY: process.env.SUPABASE_ANON_KEY,
              SUPABASE_SERVICE_ROLE_KEY: process.env.SUPABASE_SERVICE_ROLE_KEY,
              GITHUB_CLIENT_ID: process.env.GITHUB_CLIENT_ID,
              GITHUB_CLIENT_SECRET: process.env.GITHUB_CLIENT_SECRET,
              ZOHO_CLIENT_ID: process.env.ZOHO_CLIENT_ID,
              ZOHO_CLIENT_SECRET: process.env.ZOHO_CLIENT_SECRET,
              NODE_ENV: 'production'
            };
            fs.writeFileSync(path.join(resourcesDir, 'app-bootstrap.json'), JSON.stringify(data));
          "
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}

      # Run build (same script for all platforms)
      - name: Build App
        run: npm run build:pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable code signing for CI builds (no Apple Developer certs available)
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Allow auto-updater to work in unsigned builds
          SKIP_CODE_SIGNATURE_VERIFICATION: true

      # Upload platform-specific build outputs
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.yml
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') || needs.prepare.result == 'success')

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ needs.prepare.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display downloaded artifacts (debug)
        run: ls -R ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
