appId: com.snapflow.desktop
productName: SnapFlow
copyright: Copyright © 2026 SnapFlow Team
directories:
  output: dist
  buildResources: resources
publish:
  provider: github
  owner: harsh-simform
  repo: snapflow-desktop
  private: false
asarUnpack:
  - node_modules/uiohook-napi/**/*

files:
  - from: .
    filter:
      - package.json
      - app
      - node_modules/**/*

# Extra resources that should be copied to app.asar.unpacked or Resources
extraResources:
  - from: resources/tray-icon.png
    to: tray-icon.png
  - from: resources/tray-icon-white.png
    to: tray-icon-white.png
  - from: resources/icon.png
    to: icon.png
  - from: .env
    to: .env

protocols:
  - name: SnapFlow
    schemes:
      - snapflow

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SnapFlow
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico

linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  category: Utility
  maintainer: SnapFlow Team
  vendor: SnapFlow Team
  description: Screenshot Annotating Tool with Issue Tracking
